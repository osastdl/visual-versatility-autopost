name: Auto-post to Instagram & Facebook

on:
  schedule:
    # 2 posts/day aimed at a US audience (see VV_Content_Strategy_US.md):
    #   16:07 UTC = 18:07 SAST = ~12pm US Eastern (lunch scroll)
    #   22:07 UTC = 00:07 SAST = ~6pm US Eastern (evening scroll)
    # The old 08:07 (10am SAST) and 13:07 (3pm SAST) slots were the two
    # weakest in the real insights data and were dropped.
    - cron: "7 16 * * *"
    - cron: "7 22 * * *"
  workflow_dispatch: {} # lets you trigger a run manually from the Actions tab

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Run autopost script
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: python scripts/autopost.py

      - name: Commit updated calendar (marks posts as posted)
        run: |
          git config user.name "autopost-bot"
          git config user.email "actions@users.noreply.github.com"
          git add content/calendar.json
          git diff --staged --quiet || git commit -m "Mark posts as published [skip ci]"
          git push
